name: Build KIAN EMOJI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix Java and Kotlin version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("extracted/KianEmojiPrototype/app/build.gradle.kts")
          s = p.read_text()
          if "compileOptions" not in s:
              s = s.replace(
                  "android {\n",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
                  1
              )
          p.write_text(s)
          PY
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android app
        run: |
          cd extracted/KianEmojiPrototype
          gradle :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: KIAN-EMOJI-TEST
          path: extracted/KianEmojiPrototype/app/build/outputs/apk/debug/app-debug.apk
